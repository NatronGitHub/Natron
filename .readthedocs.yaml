# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the version of Python and other tools you might need
build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
    # npm ci in Documentation/: mermaid.js for the HTML, mermaid-cli for the
    # PDF and ePub (see Documentation/source/_ext/natron_mermaid.py).
    # Puppeteer 25 needs Node >= 22.12 and mermaid-cli 12 needs >= 22.13:
    # "22" is the latest 22.x release that Read the Docs provides.
    nodejs: "22"
    # You can also specify other tool versions:
    # rust: "1.70"
    # golang: "1.20"
  apt_packages:
    # the Doxygen XML of the OpenFX reference (Developers Guide)
    - doxygen
    # the shared libraries of the headless Chrome used by mermaid-cli
    - libasound2
    - libatk-bridge2.0-0
    - libatk1.0-0
    - libcups2
    - libdrm2
    - libgbm1
    - libnss3
    - libpango-1.0-0
    - libxcomposite1
    - libxdamage1
    - libxfixes3
    - libxkbcommon0
    - libxrandr2
    - fonts-liberation
    # @puppeteer/browsers 3 extracts the Chrome zip with the unzip command
    # when the optional yauzl module is not installed
    - unzip
  jobs:
    post_install:
      # mermaid.js (HTML) and mermaid-cli (PDF, ePub), from package-lock.json.
      # Only chrome-headless-shell is used: skip the full Chrome download.
      # If this fails, the diagrams are shown as source.
      - cd Documentation && PUPPETEER_CHROME_SKIP_DOWNLOAD=true npm ci --no-audit --no-fund || true

# The OpenFX Programming Guide and Reference come from this submodule.
submodules:
  include:
    - libs/OpenFX
  recursive: false

# Build documentation in the docs/ directory with Sphinx
sphinx:
   configuration: Documentation/source/conf.py

# If using Sphinx, optionally build your docs in additional formats such as PDF
formats:
   - htmlzip
   - pdf
   - epub

# Optionally declare the Python requirements required to build your docs
python:
   install:
   - requirements: Documentation/source/requirements.txt
