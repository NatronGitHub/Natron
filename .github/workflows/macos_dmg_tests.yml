name: macOS DMG tests

# Natron-Tests on a Natron DMG, installed as a user gets it, on a clean GitHub-hosted macOS runner:
# the DMG is downloaded and mounted, Natron.app is copied out of it, Homebrew is moved away (there
# is no MacPorts and no SDK), and tools/tart/run-natron-tests.sh runs the whole suite against the
# copied app, with the known failures of Natron-Tests (an unexpected pass fails the job), as
# tools/tart/natron-test.sh does in a tart VM. Called by macos_x86_64.yml (the DMG it builds, on
# the latest Intel runner) and macos_arm64.yml (the DMG built with tools/tart, on the latest arm64
# runner). The results are kept as an artifact for 14 days.
on:
  workflow_call:
    inputs:
      dmg:
        description: 'The DMG: RUN_ID/ARTIFACT (an artifact of a workflow run, with one DMG), TAG or TAG/ASSET (an asset of the GitHub release of TAG; TAG alone: its *-ARCH.dmg asset, ARCH of the runner), or an https:// URL'
        type: string
        required: true
      runner:
        description: 'The runner label (macos-26: arm64, macos-26-intel: x86_64)'
        type: string
        required: true
      results:
        description: 'The name of the artifact with the test results'
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  test:
    name: Natron-Tests on the DMG (${{ inputs.runner }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: NatronGitHub/Natron-Tests
          path: Natron-Tests
          persist-credentials: false

      - name: Download the DMG
        env:
          GH_TOKEN: ${{ github.token }}
          DMG_SOURCE: ${{ inputs.dmg }}
          RUNNER_LABEL: ${{ inputs.runner }}
        run: |
          dir=$RUNNER_TEMP/dmg
          mkdir -p "$dir"
          case $RUNNER_LABEL in *-intel) arch=x86_64 ;; *) arch=arm64 ;; esac
          case $DMG_SOURCE in
          https://*)
            curl -fL --retry 5 -o "$dir/$(basename "${DMG_SOURCE%%\?*}")" "$DMG_SOURCE" ;;
          [0-9]*/?*)
            gh run download "${DMG_SOURCE%%/*}" -R "$GITHUB_REPOSITORY" -n "${DMG_SOURCE#*/}" -D "$dir" ;;
          ?*/?*)
            gh release download "${DMG_SOURCE%%/*}" -R "$GITHUB_REPOSITORY" -p "${DMG_SOURCE#*/}" -D "$dir" ;;
          ?*)
            gh release download "$DMG_SOURCE" -R "$GITHUB_REPOSITORY" -p "*-$arch.dmg" -D "$dir" ;;
          *)
            echo "::error::no DMG given"; exit 1 ;;
          esac
          shopt -s nullglob
          dmgs=("$dir"/*.dmg)
          [ ${#dmgs[@]} = 1 ] || { echo "::error::$DMG_SOURCE: ${#dmgs[@]} DMG files, not 1"; ls -l "$dir"; exit 1; }
          ls -l "${dmgs[0]}"
          echo "DMG=${dmgs[0]}" >> "$GITHUB_ENV"
          echo "DMG_NAME=$(basename "${dmgs[0]%.dmg}")" >> "$GITHUB_ENV"

      - name: Check the DMG and the runner
        run: |
          sw_vers
          mnt=$(mktemp -d); hdiutil attach -quiet -readonly -nobrowse -mountpoint "$mnt" "$DMG"
          archs=$(lipo -archs "$mnt"/*.app/Contents/MacOS/NatronRenderer); hdiutil detach -quiet "$mnt"
          echo "NatronRenderer: $archs; runner: $(uname -m)"
          case " $archs " in
          *" $(uname -m) "*) ;;
          " x86_64 ")
            # an x86_64 DMG on an arm64 runner: only a smoke test of this workflow, under Rosetta
            echo "::warning::testing an x86_64 DMG on an arm64 runner, under Rosetta"
            arch -x86_64 /usr/bin/true 2> /dev/null || sudo softwareupdate --install-rosetta --agree-to-license ;;
          *)
            echo "::error::NatronRenderer is built for $archs: it cannot run on this $(uname -m) runner"; exit 1 ;;
          esac

      - name: Run Natron-Tests
        run: |
          # runTests.sh downloads these from SourceForge, which is sometimes flaky: fetch them first
          for z in Natron_2.3.12_Spaceship.zip Natron_2.3.12_BayMax.zip; do
            curl -fsSL --retry 5 -o "Natron-Tests/$z" "https://downloads.sourceforge.net/project/natron/Examples/$z" || rm -f "Natron-Tests/$z"
          done
          # a bare macOS, as far as possible: no Homebrew (/usr/local, /opt/homebrew), no SDK, no MacPorts
          .github/workflows/macos_x86_64_sdk.sh hide-homebrew
          [ ! -e /opt/local ] || { echo "::error::/opt/local exists"; exit 1; }
          tools/tart/run-natron-tests.sh "$DMG" Natron-Tests "$RUNNER_TEMP/results" "$DMG_NAME"

      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: ${{ inputs.results }}
          path: ${{ runner.temp }}/results
          retention-days: 14
