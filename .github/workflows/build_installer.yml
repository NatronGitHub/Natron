name: Build Installer

# The Windows installer (Setup.exe and the portable zip, #1498): built weekly (Sunday, on the
# default branch), on demand, and for release tags; never on pull requests. On pre-release tags, the
# zip and the test results are attached to the GitHub pre-release (the release job). The weekly run is never
# skipped, even if the branch didn't change: MSYS2 (setup-msys2 with update: true) is a rolling
# toolchain. Every run uses the package repository pinned by
# tools/MINGW-packages/windows_pacman_repo_version.txt (natron_package_repo-<version>.zip on the
# windows-mingw-package-repo release) and fails at once if that zip isn't published; a manual run
# can use the artifact of a "Build pacman repo" run instead (pacman_repo_run_id).
# Natron-Tests run in the natron-tests job, on a fresh runner, against the Natron that Setup.exe
# installs from the zip (#1959).
# GPL only: COMMERCIAL (non-GPL) builds are never made in CI, weekly builds or releases, only by hand
# (NATRON_LICENSE=COMMERCIAL, see tools/jenkins/README.md).
on:
  workflow_dispatch:
    inputs:
      pacman_repo_run_id:
        description: 'Optional: ID of a "Build pacman repo" run whose natron_package_repo-<version> artifact is used instead of the windows-mingw-package-repo release'
        required: false
        default: ''
      msystem:
        description: 'MSYS2 environment(s): UCRT64 (x86-64), CLANGARM64 (Windows on ARM64, #1494), or both'
        type: choice
        options: [UCRT64, CLANGARM64, both]
        default: UCRT64
  schedule:
  # Sunday, after ci.yml (03:17), linux_packages.yml (04:47) and macos_x86_64.yml (05:17)
  - cron: '17 6 * * 0'
  push:
    tags:
    - 'v*'

# Only a manual run on a branch cancels the previous manual run of that branch (one group per event).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read
  # to download the package repository artifact of another run (pacman_repo_run_id)
  actions: read

env:
  CI: 'True'
  # the Windows installer whose file list and DLLs the new one is compared with: the last one
  # built by these scripts (MINGW64, qmake)
  BASELINE_INSTALLER_URL: 'https://github.com/NatronGitHub/Natron/releases/download/v2.6.0-alpha1/Natron-RB-2.6-202305242302-b9a9b81-Windows-x86_64.zip'
  # how long the artifacts are kept: 14 days for the weekly runs (enough to compare two of them), the
  # repository's maximum (90) for the manual and tag runs
  ARTIFACT_RETENTION_DAYS: ${{ github.event_name == 'schedule' && '14' || '90' }}

jobs:
  win-installer:
    # Natron is built with CMake in an MSYS2 environment (UCRT64: gcc), never with MSVC. The
    # scripts take their paths and architecture from the environment (MINGW_PREFIX,
    # MINGW_PACKAGE_PREFIX, MSYSTEM_CARCH), so Windows ARM64 (#1494, MSYS2 CLANGARM64: clang)
    # runs the same steps on windows-11-arm, with the clangarm64 package repository.
    name: Windows Installer (${{ matrix.msystem }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        # UCRT64 on tags (CLANGARM64 isn't released yet), else the environment(s) chosen. Only
        # include, so that no environment is added by accident. repo_suffix: the name of the
        # package repository artifact of build_pacman_repo.yml (UCRT64 keeps the original name).
        # workspace: NATRON_BUILD_WORKSPACE, a short path (MAX_PATH) on the runner's largest disk:
        # windows-2022 has a D: drive, windows-11-arm only C: (#1494).
        include: ${{ fromJSON(((inputs.msystem == 'both' || github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/')) && '[{"msystem":"UCRT64","runner":"windows-2022","repo_suffix":"","workspace":"D:/nbw"},{"msystem":"CLANGARM64","runner":"windows-11-arm","repo_suffix":"-clangarm64","workspace":"C:/nbw"}]') || (inputs.msystem == 'CLANGARM64' && '[{"msystem":"CLANGARM64","runner":"windows-11-arm","repo_suffix":"-clangarm64","workspace":"C:/nbw"}]') || '[{"msystem":"UCRT64","runner":"windows-2022","repo_suffix":"","workspace":"D:/nbw"}]') }}
    env:
      NATRON_BUILD_WORKSPACE: ${{ matrix.workspace }}
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4.1.1
        with:
          submodules: recursive

      - name: Install Windows system packages
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: git unzip zip diffutils
          pacboy: wget:p ntldd:p

      - name: Package repository version
        id: repo
        run: |
          echo "version=$(cat tools/MINGW-packages/windows_pacman_repo_version.txt)" >> $GITHUB_OUTPUT

      - name: Download the package repository of a "Build pacman repo" run
        if: inputs.pacman_repo_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: natron_package_repo${{ matrix.repo_suffix }}-${{ steps.repo.outputs.version }}
          run-id: ${{ inputs.pacman_repo_run_id }}
          github-token: ${{ github.token }}
          path: natron_pacman_repo

      - name: Install Natron pacman repository
        run: |
          # fail at once if the repository of this version is neither published nor given with
          # pacman_repo_run_id, instead of building it locally for hours
          NATRON_REPO_NO_LOCAL_BUILD=1 ${GITHUB_WORKSPACE}/.github/workflows/install_natron_pacman_repo.sh ${GITHUB_WORKSPACE} ${GITHUB_WORKSPACE}/natron_pacman_repo
          # gtest (Google Test, for Tests.exe) is a dependency of natron-build-deps-common 2026.11-6, which
          # the package repository zips up to 20261126-2 predate: also install it by name (MSYS2's package)
          pacman -S --needed --noconfirm --overwrite "*" ${MINGW_PACKAGE_PREFIX}-natron-build-deps-qt5 ${MINGW_PACKAGE_PREFIX}-gtest
          # With --noconfirm, pacman silently skips a target whose dependencies
          # cannot be resolved and exits 0: check that it was really installed.
          if ! pacman -Q ${MINGW_PACKAGE_PREFIX}-natron-build-deps-qt5 ${MINGW_PACKAGE_PREFIX}-gtest; then
            echo "::error::${MINGW_PACKAGE_PREFIX}-natron-build-deps-qt5 or ${MINGW_PACKAGE_PREFIX}-gtest could not be installed (unresolvable dependencies, see above)"
            exit 1
          fi
          # for the Setup.exe step, which runs after "Uninstall Natron dependencies"
          SETUP_VERSION=$(pacman -Q ${MINGW_PACKAGE_PREFIX}-natron-setup | cut -d' ' -f2)
          echo "NATRON_SETUP_VERSION=${SETUP_VERSION}" >> $GITHUB_ENV

      - name: Build
        id: build
        run: |
          NATRON_BUILD_WORKSPACE_UNIX=$(cygpath -u ${NATRON_BUILD_WORKSPACE})
          mkdir ${NATRON_BUILD_WORKSPACE_UNIX}

          cd tools/jenkins

          # CMake build (NATRON_BUILD_SYSTEM defaults to cmake), no crash reporter until #1183. GPL
          # only: there are no COMMERCIAL builds in CI, weekly builds or releases. No Natron-Tests
          # here (UNIT_TESTS=false): the natron-tests job runs them on a fresh runner (#1959).
          WORKSPACE=${NATRON_BUILD_WORKSPACE_UNIX} BUILD_NAME=natron BUILD_NUMBER=1 BITS=64 NATRON_LICENSE=GPL GIT_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git GIT_URL_IS_NATRON=1 SNAPSHOT_BRANCH=${GITHUB_REF_NAME} QT_VERSION_MAJOR=5 NOUPDATE=1 MKJOBS=$(nproc) MINIMIZE_DISK_USAGE=1 UNIT_TESTS=false ./launchBuildMain.sh

          # the architecture in the installer name, as common.sh sets WIN_ARCH
          case "${MSYSTEM_CARCH}" in
            aarch64) WIN_ARCH=arm64 ;;
            *) WIN_ARCH=${MSYSTEM_CARCH} ;;
          esac
          ARCHIVE_DIR=${NATRON_BUILD_WORKSPACE_UNIX}/builds_archive/natron/1
          INSTALLER_ZIP_UNIX=$(ls ${ARCHIVE_DIR}/Natron*Windows-${WIN_ARCH}.zip)

          # Unzip installer zip for artifact upload so we don't get a zipped zip file.
          cd ${ARCHIVE_DIR}
          INSTALLER_DIR="${ARCHIVE_DIR}/i"
          INSTALLER_NAME=$(basename ${INSTALLER_ZIP_UNIX} .zip)
          mkdir -p ${INSTALLER_DIR}
          cd ${INSTALLER_DIR}
          unzip -q ${INSTALLER_ZIP_UNIX}

          echo "INSTALLER_NAME=${INSTALLER_NAME}" >> $GITHUB_OUTPUT
          echo "INSTALLER_DIR=$(cygpath -m ${INSTALLER_DIR})" >> $GITHUB_OUTPUT
          echo "INSTALLER_ZIP=$(cygpath -m ${INSTALLER_ZIP_UNIX})" >> $GITHUB_OUTPUT
          # the bundled DLLs and where they come from (genDllVersions.sh)
          echo "DLL_LIST=$(cygpath -m ${ARCHIVE_DIR}/${INSTALLER_NAME}-dlls.txt)" >> $GITHUB_OUTPUT

      - name: Build verify_plugin_loads binary
        run: |
          # g++ on UCRT64, clang++ on the clang environments
          CXX_BIN=$(command -v g++ || command -v clang++)
          ${CXX_BIN} -DWINDOWS -o verify_plugin_loads .github/workflows/verify_plugin_loads.cpp libs/OpenFX/HostSupport/src/ofxhBinary.cpp libs/OpenFX/HostSupport/src/ofxhUtilities.cpp -I libs/OpenFX/HostSupport/include/ -I libs/OpenFX/include/

      - name: Compare with the previous Windows installer
        # Informative: the file list and the DLLs of the new portable zip against those of
        # BASELINE_INSTALLER_URL. The report is the compare-<installer> artifact, and the DLL
        # differences are in the job summary. x86-64 only, as the baseline.
        if: matrix.msystem == 'UCRT64'
        continue-on-error: true
        run: |
          INSTALLER_DIR=$(cygpath -u '${{ steps.build.outputs.INSTALLER_DIR }}')/${{ steps.build.outputs.INSTALLER_NAME }}
          OUT=${GITHUB_WORKSPACE}/compare
          mkdir -p ${OUT} baseline
          wget -q -O baseline.zip "${BASELINE_INSTALLER_URL}"
          unzip -q baseline.zip -d baseline
          BASELINE_DIR=$(ls -d baseline/*/ | head -1)
          cp '${{ steps.build.outputs.DLL_LIST }}' ${OUT}/dlls-new.txt
          # file lists (the documentation, Python's standard library, the OCIO configs and the
          # poppler data are left out: their contents change with every version)
          list() { (cd "$1" && find . -type f | sed -e 's@^\./@@' | grep -v -E '^(Resources/docs|lib/python[0-9.]+|Resources/OpenColorIO-Configs|Resources/poppler)/' | sort -f); }
          list "${BASELINE_DIR}" > ${OUT}/files-baseline.txt
          list "${INSTALLER_DIR}" > ${OUT}/files-new.txt
          diff ${OUT}/files-baseline.txt ${OUT}/files-new.txt > ${OUT}/files.diff || true
          # DLL sets (bin/ and plug-in bundles), with the version numbers of the names replaced
          # by N (avcodec-58.dll and avcodec-62.dll are the same library)
          dlls() { (cd "$1" && find bin Plugins/OFX -iname '*.dll' | grep -v -E '^bin/[^/]+/' | sed -e 's@^Plugins/OFX/Natron/\([^/]*\)/Contents/[^/]*/@\1/@' | tr 'A-Z' 'a-z' | sed -E 's/\.cp3[0-9]+-mingw[a-z0-9_]*\.dll$/.cpN.dll/; s/python3\.[0-9]+/python3.N/; s/icu(dt|in|uc)[0-9]+/icu\1N/; s/([-_])[0-9]+([._][0-9]+)*(-x64|-arm64)?\.dll$/\1N\3.dll/' | sort -u); }
          dlls "${BASELINE_DIR}" > ${OUT}/dlls-baseline-normalized.txt
          dlls "${INSTALLER_DIR}" > ${OUT}/dlls-new-normalized.txt
          diff ${OUT}/dlls-baseline-normalized.txt ${OUT}/dlls-new-normalized.txt > ${OUT}/dlls.diff || true
          {
            echo "## Windows installer vs 2.6.0-alpha1"
            echo "Files: $(wc -l < ${OUT}/files-baseline.txt) before, $(wc -l < ${OUT}/files-new.txt) now (without docs, Python stdlib, OCIO configs, poppler data). DLLs: $(wc -l < ${OUT}/dlls-baseline-normalized.txt) before, $(wc -l < ${OUT}/dlls-new-normalized.txt) now."
            echo '```diff'
            cat ${OUT}/dlls.diff
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
          # the imported DLLs of each binary present in both trees (tools/compare-builds.sh; it doesn't
          # look for unresolved references on Windows)
          tools/compare-builds.sh -k -o ${OUT}/compare-builds -x '^Resources/docs/' -x '^lib/python' "${BASELINE_DIR}" "${INSTALLER_DIR}" > ${OUT}/compare-builds.txt 2>&1 || true
          rm -rf baseline baseline.zip

      - name: Upload the comparison
        if: always()
        uses: actions/upload-artifact@v4.3.1
        with:
          name:  compare-${{ steps.build.outputs.INSTALLER_NAME }}
          path:  ${{ github.workspace }}/compare
          if-no-files-found: ignore
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Uninstall Natron dependencies
        run: |
          pacman -Rs --noconfirm ${MINGW_PACKAGE_PREFIX}-natron-build-deps-qt5

      - name: Upload installer
        uses: actions/upload-artifact@v4.3.1
        with:
          name:  ${{ steps.build.outputs.INSTALLER_NAME }}
          path:  ${{ steps.build.outputs.INSTALLER_DIR }}
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Verify plugin loading
        run: |
          INSTALLER_DIR=$(cygpath -u '${{ steps.build.outputs.INSTALLER_DIR }}')/${{ steps.build.outputs.INSTALLER_NAME }}
          for x in $(find "${INSTALLER_DIR}/Plugins" -name '*.ofx'); do
            echo "Testing $(basename ${x}) ..."
            PATH=${INSTALLER_DIR}/bin ./verify_plugin_loads.exe "${x}"
          done

      - name: Run the bundle without MSYS2
        # After the build dependencies are uninstalled, with only the bundle's bin/ and the Windows
        # directories on PATH: a DLL, Python module or PySide module missing from the bundle fails
        # here (Tests.exe and the docs ran with /ucrt64/bin on PATH).
        # No Python caches: this tree is Setup.exe's input, and caches written here would be
        # installed as ordinary files, so the uninstall check of the next step would not test the
        # [UninstallDelete] entries of Natron.iss.
        env:
          PYTHONDONTWRITEBYTECODE: 1
        run: |
          INSTALLER_DIR=$(cygpath -u '${{ steps.build.outputs.INSTALLER_DIR }}')/${{ steps.build.outputs.INSTALLER_NAME }}
          SYSPATH="$(cygpath -u -S):$(cygpath -u -W)"
          if [ -d "${INSTALLER_DIR}/Plugins/PySide6" ]; then PYSIDE=PySide6; else PYSIDE=PySide2; fi
          cat > import_check.py <<EOF
          import sys
          import NatronEngine
          import ${PYSIDE}.QtCore
          print("Python", sys.version.split()[0], "NatronEngine", NatronEngine.natron.getNatronVersionString(), "${PYSIDE}", ${PYSIDE}.QtCore.qVersion())
          print("IMPORT_OK")
          EOF
          # run_bundle <bin dir> <program> <args>...: the program, with only <bin dir> and Windows on PATH
          # (env sets PATH for the program only: timeout and env are looked up on the normal PATH)
          run_bundle() { local b="$1" p="$2"; shift 2; timeout -k 10 600 env PATH="$b:$SYSPATH" "$b/$p" "$@" < /dev/null; }
          check_bundle() { # check_bundle <tree>
            local b="$1/bin" out
            run_bundle "$b" NatronRenderer.exe -v || { echo "::error::NatronRenderer -v failed in $1"; return 1; }
            out=$(run_bundle "$b" NatronRenderer.exe -t "$(cygpath -w import_check.py)" 2>&1) || true
            echo "$out"
            echo "$out" | grep -q 'IMPORT_OK' || { echo "::error::NatronRenderer could not import NatronEngine and ${PYSIDE}.QtCore from $1"; return 1; }
            run_bundle "$b" natron-python.exe -c "import sys, encodings, ssl, sqlite3, ctypes, ${PYSIDE}.QtCore, ${PYSIDE}.QtWidgets; print('natron-python', sys.version.split()[0], ${PYSIDE}.QtCore.qVersion())" || { echo "::error::natron-python failed in $1"; return 1; }
          }
          check_bundle "${INSTALLER_DIR}"

      - name: Install, upgrade, run and uninstall with Setup.exe
        # Setup.exe installs from the unzipped tree next to it (Natron.iss, "external" files):
        # install every component silently for the current user, and check that each
        # unconditional "Source:" of Natron.iss was installed completely (the first install goes
        # into a folder that already has a bin\keep.dll, which must survive). Then install again over
        # it (the upgrade path, [InstallDelete]): a stale DLL must be gone, the user's files must
        # stay. Run the installed programs, then uninstall and check that everything was removed.
        run: |
          INSTALLER_DIR=$(cygpath -u '${{ steps.build.outputs.INSTALLER_DIR }}')/${{ steps.build.outputs.INSTALLER_NAME }}
          ISS=tools/MINGW-packages/mingw-w64-natron-setup/Natron.iss
          # the drive of the build workspace (D: on windows-2022, C: on windows-11-arm)
          DRIVE="${NATRON_BUILD_WORKSPACE%%/*}"
          APP_W="${DRIVE}\\ni"
          APP=$(cygpath -u "${APP_W}")
          SYSPATH="$(cygpath -u -S):$(cygpath -u -W)"
          if [ -d "${INSTALLER_DIR}/Plugins/PySide6" ]; then PYSIDE=PySide6; else PYSIDE=PySide2; fi
          if [ -e "${APP}" ]; then echo "::error::${APP} already exists"; exit 1; fi
          errors=0
          # every path of the portable tree that a Source: of Natron.iss names ("{src}\<path>\*" or
          # "{src}\<path>"), and the ones without skipifsourcedoesntexist
          sources() { grep '^Source: "{src}\\' "$ISS" | sed -e 's/^Source: "{src}\\\([^"]*\)".*/\1/' -e 's/\\\*$//' -e 's/\\/\//g'; }
          required_sources() { grep '^Source: "{src}\\' "$ISS" | grep -v skipifsourcedoesntexist | sed -e 's/^Source: "{src}\\\([^"]*\)".*/\1/' -e 's/\\\*$//' -e 's/\\/\//g'; }
          # the entries of the portable tree that no Source: covers (they would not be installed)
          for e in $(cd "${INSTALLER_DIR}" && find . Plugins Plugins/OFX/Natron Resources -mindepth 1 -maxdepth 1 | sed -e 's@^\./@@' | sort -u); do
            [ "$e" = Setup.exe ] && continue
            covered=0
            while IFS= read -r src; do
              case "$src" in "$e"|"$e"/*) covered=1 ;; esac
              case "$e" in "$src"/*) covered=1 ;; esac
            done < <(sources)
            if [ "$covered" = 0 ]; then echo "::error::${e} is in the portable tree but no Source: of Natron.iss installs it"; errors=1; fi
          done
          # every subdirectory of the portable bin/ (Qt plug-in directories, mesa) needs an
          # [InstallDelete] entry, so that an upgrade removes its stale files
          for d in $(cd "${INSTALLER_DIR}/bin" && find . -mindepth 1 -maxdepth 1 -type d | sed -e 's@^\./@@'); do
            if ! grep -q -F "Type: filesandordirs; Name: \"{app}\\bin\\${d}\"" "$ISS"; then
              echo "::error::bin/${d} has no [InstallDelete] entry in Natron.iss"; errors=1
            fi
          done
          # all the components of the [Components] section, but sgl (Mesa) only in the x64 Setup.exe
          # (#if NatronArch == "x64" in Natron.iss)
          COMPONENTS=$(sed -n -e '/^\[Components\]/,/^\[/s/^Name: "\([a-z]*\)";.*/\1/p' "$ISS" | { if [ "${MSYSTEM_CARCH}" = x86_64 ]; then cat; else grep -v -x sgl; fi; } | paste -s -d, -)
          echo "Components: ${COMPONENTS}"
          setup() { # setup <log name>
            # (no MSYS2 path conversion of the /OPTIONS)
            MSYS2_ARG_CONV_EXCL='*' "${INSTALLER_DIR}/Setup.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER "/DIR=${APP_W}" "/COMPONENTS=${COMPONENTS}" "/LOG=$(cygpath -w "${GITHUB_WORKSPACE}/$1")" || { cat "$1"; echo "::error::Setup.exe failed ($1)"; return 1; }
          }
          check_installed() { # every file of each required Source: is installed
            local src missing
            while IFS= read -r src; do
              # a single file (installed under the same path: DestDir "{app}\<its directory>")
              if [ -f "${INSTALLER_DIR}/${src}" ]; then
                if ! cmp -s "${INSTALLER_DIR}/${src}" "${APP}/${src}"; then echo "::error::${src} was not installed"; errors=1; fi
                continue
              fi
              if [ ! -d "${INSTALLER_DIR}/${src}" ]; then
                echo "::error::${src} is missing from the portable tree"; errors=1; continue
              fi
              missing=$(comm -23 <(cd "${INSTALLER_DIR}/${src}" && find . -type f | sort) <(cd "${APP}/${src}" 2>/dev/null && find . -type f | sort) | wc -l)
              echo "${src}: $(cd "${INSTALLER_DIR}/${src}" && find . -type f | wc -l) files, ${missing} not installed"
              if [ "${missing}" != 0 ]; then echo "::error::${missing} files of ${src} were not installed"; errors=1; fi
            done < <(required_sources)
          }
          # Setup.exe must refuse the folder of a Natron 2.5 or older (Qt Installer Framework:
          # bin\Natron.exe next to the NatronSetup.exe maintenance tool), and leave it untouched.
          # natron-setup 1.0-9 and later only (exit code 7, #1911): older package repositories have an
          # older Setup.exe.
          # (NATRON_SETUP_VERSION: recorded when it was installed, "Uninstall Natron dependencies"
          # removed the package)
          SETUP_VERSION="${NATRON_SETUP_VERSION:?}"
          if [ "$(vercmp "${SETUP_VERSION}" 1.0-9)" -lt 0 ]; then
            echo "::warning::natron-setup ${SETUP_VERSION} is older than 1.0-9: the check that Setup.exe refuses the folder of a Natron 2.5 or older is skipped"
          else
            OLD_W="${DRIVE}\\ni25"
            OLD=$(cygpath -u "${OLD_W}")
            if [ -e "${OLD}" ]; then echo "::error::${OLD} already exists"; exit 1; fi
            mkdir -p "${OLD}/bin"
            echo old > "${OLD}/bin/Natron.exe"
            touch "${OLD}/NatronSetup.exe" "${OLD}/bin/old.dll"
            # exit code 7: PrepareToInstall refused to install
            rc=0
            MSYS2_ARG_CONV_EXCL='*' "${INSTALLER_DIR}/Setup.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER "/DIR=${OLD_W}" "/COMPONENTS=${COMPONENTS}" "/LOG=$(cygpath -w "${GITHUB_WORKSPACE}/setup-old.log")" || rc=$?
            if [ "${rc}" != 7 ] || ! grep -q -F 'Refusing the folder of Natron 2.5 or older' setup-old.log; then
              cat setup-old.log; echo "::error::Setup.exe did not refuse the folder of a Natron 2.5 or older (exit code ${rc})"; errors=1
            fi
            if [ ! -e "${OLD}/bin/old.dll" ] || [ "$(cat "${OLD}/bin/Natron.exe")" != old ] || [ -e "${OLD}/unins000.exe" ]; then
              echo "::error::Setup.exe changed the folder of a Natron 2.5 or older"; errors=1
            fi
            rm -rf "${OLD}"
          fi
          # the first install goes into an existing folder that is not a Natron installation (no
          # bin\Natron.exe): [InstallDelete] must not touch its bin\keep.dll
          mkdir -p "${APP}/bin"
          touch "${APP}/bin/keep.dll"
          setup setup-1.log || exit 1
          check_installed
          if [ ! -e "${APP}/bin/keep.dll" ]; then echo "::error::installing into a folder that was not a Natron installation deleted its bin/keep.dll"; errors=1; fi
          rm -f "${APP}/bin/keep.dll"
          # upgrade: a stale DLL (as left by an older version) must be removed by [InstallDelete];
          # the user's own files (a pip console script in bin/, an OFX plug-in next to Natron's)
          # must stay
          touch "${APP}/bin/natron-stale-test-1.dll" "${APP}/bin/natron-user-test.exe"
          mkdir -p "${APP}/Plugins/OFX/Natron/UserTest.ofx.bundle"
          touch "${APP}/Plugins/OFX/Natron/UserTest.ofx.bundle/keep"
          setup setup-2.log || exit 1
          check_installed
          if [ -e "${APP}/bin/natron-stale-test-1.dll" ]; then echo "::error::the upgrade left a stale DLL in bin/"; errors=1; fi
          for f in bin/natron-user-test.exe Plugins/OFX/Natron/UserTest.ofx.bundle/keep; do
            if [ ! -e "${APP}/$f" ]; then echo "::error::the upgrade deleted the user's $f"; errors=1; fi
          done
          rm -rf "${APP}/bin/natron-user-test.exe" "${APP}/Plugins/OFX/Natron/UserTest.ofx.bundle"
          if [ ! -x "${APP}/unins000.exe" ]; then echo "::error::no uninstaller in ${APP}"; errors=1; fi
          # the installed programs, as a user runs them: they write Python caches (__pycache__) into
          # the installation, which the uninstaller must remove ([UninstallDelete] in Natron.iss).
          # NatronRenderer with a script imports the PyPlugs (those of Plugins\PyPlugs and of the OFX
          # bundles) at startup.
          before=$(cd "${APP}" && find . -type f | sort)
          timeout -k 10 600 env PATH="${APP}/bin:${SYSPATH}" "${APP}/bin/NatronRenderer.exe" -v < /dev/null || { echo "::error::the installed NatronRenderer -v failed"; errors=1; }
          printf 'print("NatronRenderer script ran")\nimport sys\nsys.exit(0)\n' > installed_renderer.py
          timeout -k 10 600 env PATH="${APP}/bin:${SYSPATH}" "${APP}/bin/NatronRenderer.exe" --no-settings "$(cygpath -w "${GITHUB_WORKSPACE}/installed_renderer.py")" < /dev/null || { echo "::error::the installed NatronRenderer failed to run a script"; errors=1; }
          timeout -k 10 600 env PATH="${APP}/bin:${SYSPATH}" "${APP}/bin/natron-python.exe" -c "import sys, ssl, ${PYSIDE}.QtCore, ${PYSIDE}.QtWidgets; print('natron-python', sys.version.split()[0], ${PYSIDE}.QtCore.qVersion())" < /dev/null || { echo "::error::the installed natron-python failed"; errors=1; }
          wrote=$(comm -13 <(echo "${before}") <(cd "${APP}" && find . -type f | sort))
          echo "Files that the installed programs wrote into ${APP_W}:"
          echo "${wrote}" | sed -n '1,50p'
          # the uninstall check below must cover the caches of [UninstallDelete]
          if ! grep -q '^\./Plugins/PyPlugs/__pycache__/' <<< "${wrote}"; then
            echo "::error::the installed programs wrote no Plugins/PyPlugs/__pycache__: the uninstall check would not test the [UninstallDelete] entries"; errors=1
          fi
          # The uninstaller copies itself to %TEMP% and returns at once: wait until no file is left,
          # and no folder but those that existed before the first install (\ni and \ni\bin, see
          # above), which the uninstaller keeps: it only removes the folders it created. (It removes some
          # folders after unins000.exe and unins000.dat: those that still held [UninstallDelete]
          # files at its first try.)
          MSYS2_ARG_CONV_EXCL='*' "${APP}/unins000.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART || { echo "::error::the uninstaller failed"; errors=1; }
          for _ in $(seq 120); do
            [ -n "$(find "${APP}" -mindepth 1 ! -path "${APP}/bin" -print -quit 2>/dev/null)" ] || break
            sleep 2
          done
          if [ -e "${APP}" ]; then
            left=$(find "${APP}" -mindepth 1 ! -path "${APP}/bin")
            if [ -n "${left}" ]; then
              echo "::error::the uninstaller left files or folders in ${APP}:"; echo "${left}" | sed -n '1,50p'; errors=1
            fi
          fi
          exit ${errors}

      - name: Upload the files for the pre-release
        # pre-release tags only (as the release job, which attaches them)
        if: >-
          github.event_name == 'push' &&
          (contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') ||
          contains(github.ref_name, '-rc') || contains(github.ref_name, '-RC'))
        uses: actions/upload-artifact@v4.3.1
        with:
          name: Natron-Windows-${{ matrix.msystem }}-prerelease
          # the test results: natron-tests' Natron-Windows-<msystem>-tests-prerelease
          path: ${{ steps.build.outputs.INSTALLER_ZIP }}
          compression-level: 0
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  natron-tests:
    # Natron-Tests on Natron as users get it (#1959, #1655): on a fresh runner, which never had
    # MSYS2 or the build's dependencies, the portable zip built by win-installer is installed with
    # its Setup.exe into a new folder (the default "full" type, as an interactive install), and
    # runTests.sh runs against the installed NatronRenderer.exe. runTests.sh needs a POSIX shell:
    # the runner's Git Bash, with only its /usr/bin (POSIX tools and msys-*.dll, no native DLL) and
    # the Windows directories on PATH. A DLL or module missing from bin\ fails the job (the
    # installed NatronRenderer -v); one missing from a plug-in bundle fails its tests.
    # The runner: the newest Windows Server image for x86-64, windows-11-arm for CLANGARM64 (#1961).
    name: Natron-Tests (${{ matrix.msystem }}, installed with Setup.exe)
    needs: win-installer
    # each environment whose zip was uploaded, even if a later check of win-installer failed
    if: ${{ !cancelled() && needs.win-installer.result != 'skipped' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # the environments of win-installer (keep in sync with its matrix); arch: the architecture
        # in the zip name (WIN_ARCH)
        include: ${{ fromJSON(((inputs.msystem == 'both' || github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/')) && '[{"msystem":"UCRT64","runner":"windows-latest","arch":"x86_64"},{"msystem":"CLANGARM64","runner":"windows-11-arm","arch":"arm64"}]') || (inputs.msystem == 'CLANGARM64' && '[{"msystem":"CLANGARM64","runner":"windows-11-arm","arch":"arm64"}]') || '[{"msystem":"UCRT64","runner":"windows-latest","arch":"x86_64"}]') }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Download the portable zip
        uses: actions/download-artifact@v4
        with:
          # the unzipped portable tree, with Setup.exe (not the -tests or -unit_tests_failures artifacts)
          pattern: Natron-*-Windows-${{ matrix.arch }}
          # on C:, as the install, so that the step below can rename the tree
          path: C:/nd

      - name: Keep LF line endings
        # the runner's Git for Windows has core.autocrlf=true, and Natron-Tests has no
        # .gitattributes: bash can't run runTests.sh, script.sh or read the conf files with CRLF
        run: git config --global core.autocrlf false

      - name: Check out Natron-Tests
        uses: actions/checkout@v4
        with:
          repository: NatronGitHub/Natron-Tests
          ref: master
          path: Natron-Tests
          persist-credentials: false

      - name: Install with Setup.exe and run Natron-Tests
        # Fails only if Natron could not be installed or Natron-Tests could not start; the results
        # are judged in "Check the Natron-Tests results", after the uploads.
        id: natron_tests
        timeout-minutes: 150
        run: |
          SETUP=$(find /c/nd -mindepth 3 -maxdepth 3 -name Setup.exe)
          if [ "$(echo "${SETUP}" | grep -c .)" != 1 ]; then echo "::error::not exactly one Setup.exe in the artifact:"; echo "${SETUP}"; exit 1; fi
          NAME=$(basename "$(dirname "${SETUP}")")
          echo "NAME=${NAME}" >> $GITHUB_ENV
          # Setup.exe reads its files with MAX_PATH (260) paths: the tree, nested twice under its
          # long name (<artifact>/<name>/), at a short path (the longest file is 123 characters)
          if [ -e /c/ns ]; then echo "::error::C:\\ns already exists"; exit 1; fi
          mv "$(dirname "${SETUP}")" /c/ns
          SETUP=/c/ns/Setup.exe
          APP_W='C:\nt'
          APP=$(cygpath -u "${APP_W}")
          if [ -e "${APP}" ]; then echo "::error::${APP_W} already exists"; exit 1; fi
          OUT=${GITHUB_WORKSPACE}/results
          mkdir -p "${OUT}"
          MSYS2_ARG_CONV_EXCL='*' "${SETUP}" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER "/DIR=${APP_W}" /TYPE=full "/LOG=$(cygpath -w "${OUT}/${NAME}-setup.log")" || { cat "${OUT}/${NAME}-setup.log"; echo "::error::Setup.exe failed"; exit 1; }
          for f in bin/NatronRenderer.exe bin/ffmpeg.exe bin/idiff.exe Resources/OpenColorIO-Configs/blender/config.ocio; do
            if [ ! -f "${APP}/$f" ]; then echo "::error::Setup.exe did not install $f"; exit 1; fi
          done
          echo "Natron-Tests: $(git -C Natron-Tests log -1 --format='%h %cs %s')"
          # PATH for runTests.sh: Git Bash's /usr/bin before the Windows directories, whose
          # find.exe, sort.exe and timeout.exe aren't the POSIX ones (curl.exe and tar.exe come
          # from System32). Git for Windows may have no unzip, which runTests.sh uses on two zips
          # of example projects: then a minimal one with Windows' tar (bsdtar), in TOOLS.
          SYS=$(cygpath -u -S)
          TESTPATH="/usr/bin:${SYS}:$(cygpath -u -W)"
          TOOLS=${RUNNER_TEMP}/natron-tests-tools
          mkdir -p "${TOOLS}"
          if ! PATH="${TESTPATH}" command -v unzip > /dev/null; then
            printf '#!/bin/bash\n# unzip -tqq FILE (test) or unzip -o -qq FILE (extract), as runTests.sh calls it\nf="${!#}"\ncase "$1" in -t*) exec "%s/tar.exe" -tf "$f" > /dev/null ;; *) exec "%s/tar.exe" -xf "$f" ;; esac\n' "${SYS}" "${SYS}" > "${TOOLS}/unzip"
            chmod +x "${TOOLS}/unzip"
          fi
          TESTPATH="$(cygpath -u "${TOOLS}"):${TESTPATH}"
          # (the POSIX tools must not come from System32, which has its own find, sort, timeout)
          for t in bash timeout seq sed grep awk diff find sort curl unzip; do
            p=$(PATH="${TESTPATH}" command -v $t) || { echo "::error::$t is not on the PATH of runTests.sh"; exit 1; }
            case "$t:$p" in
              curl:*) ;;
              *:"${SYS}"/*) echo "::error::$t is the Windows one ($p), not a POSIX tool"; exit 1 ;;
            esac
          done
          if [ -n "$(cd Natron-Tests && git ls-files --eol runTests.sh | grep crlf)" ] || grep -q $'\r' Natron-Tests/runTests.sh; then
            echo "::error::Natron-Tests was checked out with CRLF line endings"; exit 1
          fi
          # the installed Natron must start, with nothing but Windows on PATH (otherwise every test
          # would fail, which is only a warning)
          timeout -k 10 600 env PATH="$(cygpath -u -S):$(cygpath -u -W)" "${APP}/bin/NatronRenderer.exe" -v < /dev/null || { echo "::error::the installed NatronRenderer -v failed"; exit 1; }
          # (OCIO: a Windows path, as Natron reads it; KNOWN_FAILURES_ARCH: Git Bash sets no
          # MSYSTEM_CARCH, and may run emulated on ARM64)
          status=0
          (cd Natron-Tests && timeout -s KILL 7200 env PATH="${TESTPATH}" KNOWN_FAILURES_ARCH=${{ matrix.arch }} \
            OCIO="$(cygpath -m "${APP}/Resources/OpenColorIO-Configs/blender/config.ocio")" \
            FFMPEG="${APP}/bin/ffmpeg.exe" COMPARE="${APP}/bin/idiff.exe" \
            bash runTests.sh "${APP}/bin/NatronRenderer.exe" < /dev/null > "${OUT}/${NAME}-tests.log" 2>&1) || status=$?
          echo "runTests.sh exited with status ${status} (its output: ${NAME}-tests.log in the ${NAME}-tests artifact)"
          # a render killed by the timeout may leave NatronRenderer running
          taskkill -f -im NatronRenderer.exe -t > /dev/null 2>&1 || true
          cd Natron-Tests
          [ ! -f result.txt ] || mv result.txt "${OUT}/${NAME}-tests.txt"
          [ ! -f summary.txt ] || { cat summary.txt; mv summary.txt "${OUT}/${NAME}-tests-summary.txt"; }
          if [ -n "$(ls -A failed 2> /dev/null)" ]; then
            "${SYS}/tar.exe" -a -cf "$(cygpath -w "${OUT}/${NAME}-unit_tests_failures.zip")" -C "$(cygpath -w failed)" . || echo "::warning::could not zip the failed tests' outputs"
          fi
          if [ ! -f "${OUT}/${NAME}-tests.txt" ]; then tail -n 50 "${OUT}/${NAME}-tests.log"; fi

      - name: Upload test results
        if: ${{ !cancelled() && steps.natron_tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4.3.1
        with:
          name:  ${{ env.NAME }}-tests
          path: |
            results/${{ env.NAME }}-tests.txt
            results/${{ env.NAME }}-tests-summary.txt
            results/${{ env.NAME }}-tests.log
            results/${{ env.NAME }}-setup.log
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Upload test failures
        if: ${{ !cancelled() && steps.natron_tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4.3.1
        with:
          name:  ${{ env.NAME }}-unit_tests_failures
          path:  results/${{ env.NAME }}-unit_tests_failures.zip
          if-no-files-found: ignore
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Compare the passing tests with the 2.5.0 release
        # Informative: 2.5.0 was a Qt4 MINGW64 (x86-64) build, so differences are expected
        if: matrix.msystem == 'UCRT64'
        continue-on-error: true
        run: |
          curl -fsSL -O https://github.com/NatronGitHub/Natron/releases/download/v2.5.0/Natron-2.5.0-Windows-x86_64-tests.txt
          if diff Natron-2.5.0-Windows-x86_64-tests.txt "results/${NAME}-tests.txt"; then
            echo "Test results match the 2.5.0 release"
          else
            echo "::warning::Natron-Tests results differ from the 2.5.0 release (see the diff above)"
          fi

      - name: Upload the test results for the pre-release
        # pre-release tags only (as the release job, which attaches them)
        if: >-
          github.event_name == 'push' &&
          (contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') ||
          contains(github.ref_name, '-rc') || contains(github.ref_name, '-RC'))
        uses: actions/upload-artifact@v4.3.1
        with:
          name: Natron-Windows-${{ matrix.msystem }}-tests-prerelease
          path: |
            results/${{ env.NAME }}-tests.txt
            results/${{ env.NAME }}-tests-summary.txt
            results/${{ env.NAME }}-unit_tests_failures.zip
          compression-level: 0
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Check the Natron-Tests results
        # Last, so that every other check and upload runs first; not if Natron-Tests could not
        # start (that step failed already). runTests.sh doesn't fail the step when a test fails. A
        # known failure that passed (UNEXPECTED PASS) fails the job: Natron-Tests' known_failures/
        # lists must be updated. Other failures are only warnings, as long as the Windows known
        # failures aren't checked against a 2.6 run (#1629).
        if: ${{ !cancelled() && steps.natron_tests.outcome == 'success' }}
        run: |
          RESULTS="results/${NAME}-tests.txt"
          SUMMARY="results/${NAME}-tests-summary.txt"
          # summary.txt is written last: without it, runTests.sh did not finish (killed by its
          # timeout, for example) and result.txt has the raw PASS/FAIL lines, known failures included
          if [ ! -f "${SUMMARY}" ]; then echo "::error::no Natron-Tests summary (${SUMMARY}): Natron-Tests did not finish"; exit 1; fi
          {
            echo "## Natron-Tests (${{ matrix.msystem }}, installed with Setup.exe)"
            echo '```'
            cat "${SUMMARY}"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
          sed -n -e 's/ : FAIL$//p' "${RESULTS}" | while IFS= read -r t; do
            echo "::warning::Natron-Tests: $t failed and isn't a known failure"
          done
          sed -n -e 's/ : UNEXPECTED PASS$//p' "${RESULTS}" | while IFS= read -r t; do
            echo "::error::Natron-Tests: $t is a known failure that passed (UNEXPECTED PASS): remove it from Natron-Tests' known_failures/"
          done
          if grep -q '^UNEXPECTED PASS: [1-9]' "${SUMMARY}"; then exit 1; fi

  # pre-release tags only (v*-alpha*, -beta*, -rc*, -RC*, as linux_packages.yml and macos_x86_64.yml):
  # attach the portable zip (with Setup.exe) and the test results to the GitHub pre-release
  release:
    name: Attach to the pre-release
    needs: [win-installer, natron-tests]
    if: >-
      ${{ !cancelled() && needs.win-installer.result == 'success' && needs.natron-tests.result == 'success' && github.event_name == 'push' &&
      (contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') ||
      contains(github.ref_name, '-rc') || contains(github.ref_name, '-RC')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/workflows/attach_to_prerelease.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          # the zips (win-installer) and the test results (natron-tests)
          pattern: Natron-Windows-*-prerelease
          path: assets
          merge-multiple: true
      - name: Attach to the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l assets
          shopt -s nullglob
          .github/workflows/attach_to_prerelease.sh "$GITHUB_REF_NAME" assets/*.zip assets/*-tests.txt assets/*-tests-summary.txt
