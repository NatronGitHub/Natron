name: macOS x86_64 DMG

# The macOS x86_64 (Intel) DMG of Natron, built for macOS 14.0 on GitHub's Intel runner
# (macos-15-intel: at most one macOS release above the deployment target, see macos_dmg.yml), and
# tested with Natron-Tests on the latest Intel runner (macos-26-intel). macos_arm64.yml does the
# same for the arm64 DMG. Runs weekly (Sunday), on demand, and on pre-release tags (v*-alpha*,
# -beta*, -rc*, -RC*), never on pull requests.
#
# build: the SDK, the DMG and the tests (macos_dmg.yml, which describes the steps).
# release (pre-release tags only): the DMG and the test results attached to the GitHub release.
# Weekly and on-demand runs keep the DMG and test results as artifacts for 14 days.
on:
  workflow_dispatch:
    inputs:
      sdk:
        description: 'SDK: reuse (same definition, < 30 days old; else update the newest), update (the newest), or scratch (rebuild it, about 8.5 hours)'
        type: choice
        options: [reuse, update, scratch]
        default: reuse
  schedule:
  # Sunday 05:17 UTC (ci.yml runs at 03:17)
  - cron: '17 5 * * 0'
  push:
    # pre-release tags, as linux_packages.yml
    tags:
    - 'v*-alpha*'
    - 'v*-beta*'
    - 'v*-rc*'
    - 'v*-RC*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/macos_dmg.yml
    permissions:
      contents: read
      actions: read
    with:
      arch: x86_64
      build_runner: macos-15-intel
      test_runner: macos-26-intel
      sdk: ${{ inputs.sdk || 'reuse' }}

  release:
    name: Attach to the release
    needs: build
    # pre-release tags only (the push trigger), not a workflow_dispatch run on a tag
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/workflows/attach_to_prerelease.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          pattern: Natron-macOS-x86_64-{dmg,tests}
          merge-multiple: true
          path: assets

      - name: Upload the assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l assets
          # as linux_packages.yml: the DMG, <dmg>-tests.txt, -tests-summary.txt and -unit_tests_failures.zip
          shopt -s nullglob
          .github/workflows/attach_to_prerelease.sh "$TAG" assets/*.dmg assets/*-tests.txt assets/*-tests-summary.txt assets/*-unit_tests_failures.zip
