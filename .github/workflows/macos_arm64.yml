name: macOS arm64 DMG tests

# Natron-Tests on the macOS arm64 DMG on the latest macOS arm64 runner (macos-26), as users get it
# (macos_dmg_tests.yml). The DMG is not built here: it is built for macOS 14 in a tart VM on the
# maintainer's Mac (tools/tart/natron-build.sh), and uploaded as a GitHub release asset (see
# tools/tart/README.md). This checks that the macOS 14 build runs on the newest macOS.
# Runs on demand, and on pre-release tags (as macos_x86_64.yml) if the release of the tag already
# has an *-arm64.dmg asset (otherwise the run only says so: upload the DMG, then run it on demand).
# When the DMG is the arm64 DMG asset of a v* release and the tests pass, the test results are
# attached to that release, next to the DMG.
on:
  workflow_dispatch:
    inputs:
      dmg:
        description: 'The DMG: TAG (the *-arm64.dmg asset of the GitHub release of TAG), TAG/ASSET, RUN_ID/ARTIFACT (an artifact of a workflow run), or the https:// URL of a .dmg file'
        type: string
        required: true
      attach:
        description: 'Attach the test results to the release, if the DMG is the arm64 DMG asset of a v* release and the tests pass'
        type: boolean
        default: true
  push:
    tags:
    - 'v*-alpha*'
    - 'v*-beta*'
    - 'v*-rc*'
    - 'v*-RC*'

permissions:
  contents: read

concurrency:
  # macOS runners are scarce: one run at a time per ref (a newer pending run replaces an older one)
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  find:
    name: Download the DMG
    # on Linux: a tag without a DMG holds no macOS runner
    runs-on: ubuntu-latest
    permissions:
      # draft releases (where tools/tart/README.md puts the DMGs that aren't release assets) are
      # visible only with push access; this job runs no code of the repository, only gh and curl
      contents: write
      actions: read
    outputs:
      found: ${{ steps.find.outputs.found }}
      tag: ${{ steps.find.outputs.tag }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DMG_SOURCE: ${{ inputs.dmg }}
          ATTACH: ${{ inputs.attach }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = push ]; then
            if ! gh release view "$TAG" --json assets --jq '.assets[].name' | grep -q -- '-arm64\.dmg$'; then
              echo "::notice::the release of $TAG has no *-arm64.dmg asset (yet): upload the tart DMG, then run this workflow with dmg=$TAG (tools/tart/README.md)"
              exit 0
            fi
            DMG_SOURCE=$TAG ATTACH=true
          fi
          dir=$RUNNER_TEMP/dmg
          mkdir -p "$dir"
          case $DMG_SOURCE in
          https://*)
            url=${DMG_SOURCE%%\?*}
            case $url in *.dmg) ;; *) echo "::error::$DMG_SOURCE: not the URL of a .dmg file"; exit 1 ;; esac
            curl -fL --retry 5 -o "$dir/$(basename "$url")" "$DMG_SOURCE" ;;
          [0-9]*/?*)
            gh run download "${DMG_SOURCE%%/*}" -n "${DMG_SOURCE#*/}" -D "$dir" ;;
          ?*/?*)
            gh release download "${DMG_SOURCE%%/*}" -p "${DMG_SOURCE#*/}" -D "$dir" ;;
          ?*)
            gh release download "$DMG_SOURCE" -p '*-arm64.dmg' -D "$dir" ;;
          *)
            echo "::error::no DMG given"; exit 1 ;;
          esac
          shopt -s nullglob
          dmgs=("$dir"/*.dmg)
          [ ${#dmgs[@]} = 1 ] || { echo "::error::$DMG_SOURCE: ${#dmgs[@]} DMG files, not 1"; ls -l "$dir"; exit 1; }
          ls -l "${dmgs[0]}"
          echo "found=true" >> "$GITHUB_OUTPUT"
          # the results are attached only for the arm64 DMG asset of a v* release (TAG or TAG/ASSET),
          # not for a run artifact, a URL, or another asset (e.g. the x86_64 DMG, whose results
          # macos_x86_64.yml attaches)
          case $DMG_SOURCE:${dmgs[0]} in
          https://*|[0-9]*/*) ;;
          v*-arm64.dmg) [ "$ATTACH" != true ] || echo "tag=${DMG_SOURCE%%/*}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Keep the DMG for the test job
        if: steps.find.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Natron-macOS-dmg-to-test
          path: ${{ runner.temp }}/dmg/*.dmg
          retention-days: 1
          compression-level: 0

  test:
    needs: find
    if: needs.find.outputs.found == 'true'
    uses: ./.github/workflows/macos_dmg_tests.yml
    with:
      artifact: Natron-macOS-dmg-to-test
      runner: macos-26
      results: Natron-macOS-arm64-tests

  release:
    name: Attach the test results to the release
    needs: [find, test]
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.find.outputs.tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/workflows/attach_to_prerelease.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: Natron-macOS-arm64-tests
          path: assets

      - name: Upload the test results
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.find.outputs.tag }}
        run: |
          ls -l assets
          # as macos_x86_64.yml: <dmg>-tests.txt, -tests-summary.txt and -unit_tests_failures.zip
          shopt -s nullglob
          .github/workflows/attach_to_prerelease.sh "$TAG" assets/*-tests.txt assets/*-tests-summary.txt assets/*-unit_tests_failures.zip
