name: Linux packages

# Linux portable archives, x86_64 and aarch64 (#1498, #1654, #1655):
# 1. the Rocky Linux 9 SDK image (tools/docker/natron-sdk-rockylinux), only when its definition
#    changed (the hash of the files below) or on demand ("rebuild_sdk"), built in stages
#    (linux_sdk_stage.yml) and pushed to ghcr.io/<owner>/natron-sdk-rockylinux9 as :<hash> and,
#    on the default branch, :latest (multi-arch; :<hash>-amd64 and :<hash>-arm64 per arch);
# 2. the package: tools/jenkins/launchBuildMain.sh in the SDK image (CMake builds of Natron and
#    the plug-ins, the bundled unit tests, the portable archive, whose system libraries and
#    symbol versions build-Linux-installer.sh checks against Rocky Linux 9.0, checkBundle);
# 3. Natron-Tests (master, or the natron_tests_ref input) on the archive, in a clean rockylinux/rockylinux:9 container
#    (tools/docker/natron-test.sh): <name>-tests.txt, <name>-unit_tests_failures.zip;
# 4. Natron-Tests on the archive again, directly on the latest Ubuntu runner of each arch, with
#    the runtime libraries that a desktop has installed (natron-test.sh -H; #1964, #1965): newer
#    glibc, libstdc++ and X11/GL libraries than Rocky Linux 9's. The runner image has much more
#    than a desktop, so only the Rocky Linux 9 job (and checkBundle) catches a library missing
#    from the archive.
# Weekly (Sunday), on demand, and on pre-release tags (v2.6.0-rc1, -beta1, -alpha.1, ...), whose release gets the
# archives and the test results; never on pull requests. The archives and the test results are
# kept 14 days as workflow artifacts. On RB-2.6, the weekly and on-demand runs whose packages and
# Natron-Tests all passed also replace the archives of the rolling natron_testing pre-release, for
# the plug-ins' CI (#1925, see the natron_testing job). Never skipped: the plug-ins are built from their moving
# branches (Global/plugin-branches.sh). GPL only (no COMMERCIAL build, see tools/jenkins/README.md).
on:
  workflow_dispatch:
    inputs:
      natron_tests_ref:
        description: 'Natron-Tests branch, tag or commit to test with (default master), e.g. the branch of a Natron-Tests pull request'
        required: false
        default: master
      rebuild_sdk:
        description: 'Rebuild the SDK image from scratch (newest Rocky Linux 9 base image and packages, no layer cache), even if its definition did not change'
        type: boolean
        default: false
  schedule:
  - cron: '47 4 * * 0'
  push:
    tags:
    - 'v*-alpha*'
    - 'v*-beta*'
    - 'v*-rc*'
    - 'v*-RC*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sdk_check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      image: ${{ steps.sdk.outputs.image }}
      hash: ${{ steps.sdk.outputs.hash }}
      build: ${{ steps.sdk.outputs.build }}
      default_branch: ${{ steps.sdk.outputs.default_branch }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - id: sdk
      env:
        OWNER: ${{ github.repository_owner }}
        REBUILD: ${{ inputs.rebuild_sdk }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        image="ghcr.io/${OWNER,,}/natron-sdk-rockylinux9"
        # the SDK definition: the files that the SDK build uses (the package job runs the
        # tools/jenkins scripts of its own checkout, not the copies in the image)
        hash=$(git ls-tree -r HEAD -- tools/jenkins/include/scripts/build-Linux-sdk.sh \
            tools/jenkins/include/scripts/pkg tools/jenkins/include/patches \
            tools/jenkins/common.sh tools/jenkins/compiler-common.sh tools/docker/natron-sdk-rockylinux |
            sha256sum | cut -c1-16)
        # (the schedule event has no repository object: ask the API)
        default_branch=false
        [ "$GITHUB_REF" != "refs/heads/$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)" ] || default_branch=true
        build=true
        if [ "$REBUILD" != true ] && docker buildx imagetools inspect "$image:$hash" > /dev/null 2>&1; then
            build=false
        fi
        echo "SDK image $image:$hash, build: $build, default branch: $default_branch"
        { echo "image=$image"; echo "hash=$hash"; echo "build=$build"; echo "default_branch=$default_branch"; } >> "$GITHUB_OUTPUT"

  # one job per stage (STAGE_ENDS in tools/docker/natron-sdk-rockylinux/split-stages.sh)
  sdk_stage1:
    needs: sdk_check
    if: needs.sdk_check.outputs.build == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/linux_sdk_stage.yml
    with:
      stage: '1'
      image: ${{ needs.sdk_check.outputs.image }}
      hash: ${{ needs.sdk_check.outputs.hash }}
      rebuild: ${{ inputs.rebuild_sdk == true }}
      export_cache: ${{ needs.sdk_check.outputs.default_branch == 'true' }}
  sdk_stage2:
    needs: [sdk_check, sdk_stage1]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/linux_sdk_stage.yml
    with:
      stage: '2'
      image: ${{ needs.sdk_check.outputs.image }}
      hash: ${{ needs.sdk_check.outputs.hash }}
      rebuild: ${{ inputs.rebuild_sdk == true }}
      export_cache: ${{ needs.sdk_check.outputs.default_branch == 'true' }}
  sdk_stage3:
    needs: [sdk_check, sdk_stage2]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/linux_sdk_stage.yml
    with:
      stage: '3'
      image: ${{ needs.sdk_check.outputs.image }}
      hash: ${{ needs.sdk_check.outputs.hash }}
      rebuild: ${{ inputs.rebuild_sdk == true }}
      export_cache: ${{ needs.sdk_check.outputs.default_branch == 'true' }}
  sdk_stage4:
    needs: [sdk_check, sdk_stage3]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/linux_sdk_stage.yml
    with:
      stage: '4'
      image: ${{ needs.sdk_check.outputs.image }}
      hash: ${{ needs.sdk_check.outputs.hash }}
      rebuild: ${{ inputs.rebuild_sdk == true }}
      export_cache: ${{ needs.sdk_check.outputs.default_branch == 'true' }}
  sdk_final:
    needs: [sdk_check, sdk_stage4]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/linux_sdk_stage.yml
    with:
      stage: final
      image: ${{ needs.sdk_check.outputs.image }}
      hash: ${{ needs.sdk_check.outputs.hash }}
      rebuild: ${{ inputs.rebuild_sdk == true }}
      export_cache: ${{ needs.sdk_check.outputs.default_branch == 'true' }}

  sdk_manifest:
    needs: [sdk_check, sdk_final]
    # also when the SDK image exists, to move :latest to it on the default branch
    if: ${{ !cancelled() && needs.sdk_check.result == 'success' && (needs.sdk_final.result == 'success' || needs.sdk_check.outputs.build == 'false') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Multi-arch tags
      env:
        IMAGE: ${{ needs.sdk_check.outputs.image }}
        HASH: ${{ needs.sdk_check.outputs.hash }}
        DEFAULT_BRANCH: ${{ needs.sdk_check.outputs.default_branch }}
      run: |
        tags=(-t "$IMAGE:$HASH")
        # :latest is the SDK of the default branch only
        [ "$DEFAULT_BRANCH" != true ] || tags+=(-t "$IMAGE:latest")
        docker buildx imagetools create "${tags[@]}" "$IMAGE:$HASH-amd64" "$IMAGE:$HASH-arm64"
        docker buildx imagetools inspect "$IMAGE:$HASH"

  package:
    needs: [sdk_check, sdk_manifest]
    # the SDK image exists, or was just built
    if: ${{ !cancelled() && needs.sdk_check.result == 'success' && (needs.sdk_check.outputs.build == 'false' || needs.sdk_manifest.result == 'success') }}
    name: package ${{ matrix.arch }}
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x86_64
          runner: ubuntu-24.04
          docker_arch: amd64
        - arch: aarch64
          runner: ubuntu-24.04-arm
          docker_arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build Natron, the plug-ins and the portable archive
      env:
        SDK_IMAGE: ${{ needs.sdk_check.outputs.image }}:${{ needs.sdk_check.outputs.hash }}-${{ matrix.docker_arch }}
        ARCH: ${{ matrix.arch }}
      run: |
        work="$RUNNER_TEMP/natron-build"
        mkdir -p "$work/builds" "$work/tmp"
        opts=()
        if [ "$GITHUB_REF_TYPE" = tag ]; then
            # v2.6.0-rc1: RELEASE_TAG=2.6.0-rc1, NATRON_DEV_STATUS=RC, NATRON_BUILD_NUMBER=1; the
            # plug-in repositories must have the tag Natron-2.6.0-rc1 (see launchBuildMain.sh)
            version="${GITHUB_REF_NAME#v}"
            suffix="${version#*-}"
            number="${suffix##*[!0-9]}"
            kind="${suffix%"$number"}"
            case "${kind%.}" in
                alpha) status=ALPHA ;;
                beta) status=BETA ;;
                rc|RC) status=RC ;;
                *) echo "Error: $GITHUB_REF_NAME is not a pre-release tag (vX.Y.Z-alphaN, -betaN or -rcN, or alpha.N...)"; exit 1 ;;
            esac
            opts+=(-e RELEASE_TAG="$version" -e NATRON_DEV_STATUS="$status" -e NATRON_BUILD_NUMBER="${number:-1}")
        else
            opts+=(-e GIT_BRANCH="$GITHUB_REF_NAME" -e GIT_COMMIT="$GITHUB_SHA")
        fi
        df -h /
        docker pull -q "$SDK_IMAGE"
        # launchBuildMain.sh checks out Natron and the plug-ins. It runs with the tools/jenkins
        # scripts of this commit, not with the copies in the SDK image (as the image's command does)
        time docker run --rm \
            -v "$work/builds:/home/builds_archive" -v "$work/tmp:/home/tmp" \
            -v "$PWD/tools/jenkins:/home/natron-jenkins:ro" \
            -e GIT_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" -e GIT_URL_IS_NATRON=1 \
            -e NATRON_LICENSE=GPL -e UNIT_TESTS=false -e MKJOBS="$(nproc)" "${opts[@]}" \
            "$SDK_IMAGE" bash -c 'cp -R /home/natron-jenkins/. /home/ && exec scl enable gcc-toolset-14 ./launchBuildMain.sh'
        df -h /
        archive=$(find "$work/builds" -name '*-no-installer.tar.xz' | head -1)
        [ -n "$archive" ] || { echo "Error: no portable archive in $work/builds"; exit 1; }
        # no Python caches under Plugins/, as written by the Tests runs of the build and packaging (#1923)
        listing=$(tar tJf "$archive")
        caches=$(grep '/Plugins/.*__pycache__/' <<< "$listing" || true)
        [ -z "$caches" ] || { echo "Error: the portable archive has Python caches under Plugins/:"; echo "$caches" | head -20; exit 1; }
        mkdir -p dist
        # cp: the build directories belong to root (the container)
        cp "$archive" dist/
        # the commits that the build used, as build-natron.sh gives them to the About dialog
        # (GitVersion.h): OPENFX_<P>_GIT_COMMIT, or else OPENFX_<P>_GIT_BRANCH, which
        # checkoutRepository sets to the commit it checked out. One "<repository> <commit>" line
        # each, for the natron_testing release (natron_testing job)
        options="$(dirname "$archive")/buildOptions.sh"
        if [ -f "$options" ]; then
            option() { sed -n "s/^$1=//p" "$options" | tail -1 | tr -d "\"'"; }
            {
                echo "Natron $(option NATRON_GIT_COMMIT)"
                for p in IO MISC ARENA GMIC; do
                    commit=$(option "OPENFX_${p}_GIT_COMMIT")
                    echo "openfx-${p,,} ${commit:-$(option "OPENFX_${p}_GIT_BRANCH")}"
                done
            } > "dist/Natron-Linux-$ARCH-commits.txt"
            cat "dist/Natron-Linux-$ARCH-commits.txt"
        else
            echo "::warning::no $options: no commits file"
        fi
        ls -l dist
    - uses: actions/upload-artifact@v4
      with:
        name: Natron-Linux-${{ matrix.arch }}
        path: |
          dist/*.tar.xz
          dist/*-commits.txt
        compression-level: 0
        retention-days: 14
        if-no-files-found: error

  test:
    needs: package
    # each arch whose archive was built, even if the other one failed
    if: ${{ !cancelled() && needs.package.result != 'skipped' }}
    name: Natron-Tests ${{ matrix.arch }}
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x86_64
          runner: ubuntu-24.04
        - arch: aarch64
          runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/checkout@v4
      with:
        repository: NatronGitHub/Natron-Tests
        ref: ${{ inputs.natron_tests_ref || 'master' }}
        path: Natron-Tests
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        name: Natron-Linux-${{ matrix.arch }}
        path: dist
    - name: Run Natron-Tests in a clean Rocky Linux 9 container
      run: tools/docker/natron-test.sh -n Natron-Tests -o results dist/*.tar.xz
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Natron-Linux-${{ matrix.arch }}-tests
        path: results/
        retention-days: 14
        if-no-files-found: warn

  # The same suite, on the latest Ubuntu runner of each arch, directly on the host: the archive
  # installed as a user would (extracted into a new directory, run with a new empty HOME and a
  # clean environment), with newer system libraries than Rocky Linux 9's (#1964, #1965). The
  # results are named as in the test job; the artifact name doesn't match Natron-Linux-*, so the
  # release job attaches only the Rocky Linux 9 results.
  test_latest:
    needs: package
    if: ${{ !cancelled() && needs.package.result != 'skipped' }}
    name: Natron-Tests ${{ matrix.arch }} on ${{ matrix.runner }}
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        include:
        - arch: x86_64
          runner: ubuntu-26.04
        - arch: aarch64
          runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/checkout@v4
      with:
        repository: NatronGitHub/Natron-Tests
        ref: ${{ inputs.natron_tests_ref || 'master' }}
        path: Natron-Tests
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        name: Natron-Linux-${{ matrix.arch }}
        path: dist
    - name: Install the runtime libraries that every desktop has
      run: |
        # Ubuntu's names for the system libraries that the archive never bundles (INSTALL_LINUX.md,
        # "Runtime requirements of the Linux binaries"; the dnf list of natron-test.sh): libgomp,
        # GLVND's libGL/libEGL/libOpenGL (with Ubuntu's Mesa, which they depend on; no Xvfb:
        # NatronRenderer needs no display), the X11 client libraries and the core libxcb (not the
        # xcb extension, xcb-util and xkbcommon libraries, which the archive bundles, #2024) and
        # ALSA, which Qt's libraries link to, and fontconfig with a font. Most of them are already
        # on the runner image. Plus the tools that runTests.sh uses (zip, unzip, xz).
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends libgomp1 libgl1 libegl1 libopengl0 \
            libx11-6 libx11-xcb1 libxext6 libxrender1 libxi6 libxfixes3 libxrandr2 libxcursor1 \
            libxinerama1 libxcomposite1 libxdamage1 libxtst6 libsm6 libice6 libxcb1 \
            libasound2t64 fontconfig fonts-dejavu-core zip unzip xz-utils
        . /etc/os-release
        echo "$PRETTY_NAME, $(ldd --version | head -1), $(uname -m)"
    - name: Run Natron-Tests on the latest Ubuntu
      run: tools/docker/natron-test.sh -H -n Natron-Tests -o results dist/*.tar.xz
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Natron-Tests-Linux-${{ matrix.arch }}-${{ matrix.runner }}
        path: results/
        retention-days: 14
        if-no-files-found: warn

  # pre-release tags only: attach the archives and the test results to the GitHub pre-release
  release:
    needs: [package, test]
    # what was built, even if one arch failed; never the results of a natron_tests_ref under test
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') && (inputs.natron_tests_ref || 'master') == 'master' && needs.package.result != 'skipped' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        sparse-checkout: .github/workflows/attach_to_prerelease.sh
        sparse-checkout-cone-mode: false
    - uses: actions/download-artifact@v4
      with:
        pattern: Natron-Linux-*
        path: dist
        merge-multiple: true
    - name: Attach to the pre-release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
      run: |
        # no archive at all (both arches failed): no release
        ls -l dist/*.tar.xz
        shopt -s nullglob
        .github/workflows/attach_to_prerelease.sh "$GITHUB_REF_NAME" dist/*.tar.xz dist/*-tests.txt dist/*-tests-summary.txt dist/*-unit_tests_failures.zip

  # RB-2.6, weekly and on demand only (never pull requests, tags or other branches): replace the
  # assets of the rolling public pre-release natron_testing, which the plug-in repositories' CI
  # downloads without a token (#1925; Documentation/source/devel/guitesting.rst):
  # Natron-RB-2.6-Linux-<arch>.tar.xz (the portable archive, renamed), natron_testing-commit.txt
  # (the Natron commit they were built from, whose Tests/gui/natronheadless.py and natrontest.py
  # the plug-in tests use) and Natron-RB-2.6-Linux-<arch>-commits.txt (the commits of Natron and of
  # the bundled plug-ins, per arch: the plug-ins are built from moving branches). The release and its tag are created at the first run; later runs only
  # replace the assets (the tag doesn't move: the commit is in natron_testing-commit.txt).
  natron_testing:
    needs: [package, test, test_latest]
    # all or nothing, so that both archives match natron_testing-commit.txt: the result of a matrix
    # job is success only if every arch succeeded (package: built and checked, test and
    # test_latest: Natron-Tests passed on Rocky Linux 9 and on the latest Ubuntu, known failures
    # excepted; the plug-ins' CI runs on recent Ubuntu runners), with Natron-Tests master (not a
    # natron_tests_ref under test)
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/RB-2.6' && (inputs.natron_tests_ref || 'master') == 'master' && needs.package.result == 'success' && needs.test.result == 'success' && needs.test_latest.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: Natron-Linux-x86_64
        path: dist/x86_64
    - uses: actions/download-artifact@v4
      with:
        name: Natron-Linux-aarch64
        path: dist/aarch64
    - name: Replace the natron_testing assets
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
      run: |
        assets=()
        for arch in x86_64 aarch64; do
            src=(dist/"$arch"/*.tar.xz)
            [ ${#src[@]} = 1 ] && [ -f "${src[0]}" ] || { echo "Error: expected one archive in dist/$arch"; ls -l "dist/$arch"; exit 1; }
            dst="dist/Natron-$GITHUB_REF_NAME-Linux-$arch.tar.xz"
            mv "${src[0]}" "$dst"
            assets+=("$dst")
            commits=(dist/"$arch"/*-commits.txt)
            [ ${#commits[@]} = 1 ] && [ -f "${commits[0]}" ] || { echo "Error: expected one commits file in dist/$arch"; ls -l "dist/$arch"; exit 1; }
            dst="dist/Natron-$GITHUB_REF_NAME-Linux-$arch-commits.txt"
            mv "${commits[0]}" "$dst"
            assets+=("$dst")
        done
        # first and only line: the Natron commit (the per-arch commits files also have it)
        echo "$GITHUB_SHA" > dist/natron_testing-commit.txt
        ls -l "${assets[@]}" dist/natron_testing-commit.txt
        gh release view natron_testing > /dev/null 2>&1 ||
            gh release create natron_testing --prerelease --target "$GITHUB_SHA" \
                --title "Natron $GITHUB_REF_NAME builds for automated testing" \
                --notes "Rolling builds of Natron $GITHUB_REF_NAME for the plug-ins' CI, not releases: the Linux portable archives, replaced by the weekly and on-demand runs of the Linux packages workflow (.github/workflows/linux_packages.yml) whose packages and Natron-Tests passed. natron_testing-commit.txt is the Natron commit they were built from (the natron_testing tag doesn't move), and Natron-$GITHUB_REF_NAME-Linux-<arch>-commits.txt the commits of Natron and of the bundled plug-ins. See \"Testing plug-ins with a Natron build\" in Documentation/source/devel/guitesting.rst."
        gh release upload natron_testing --clobber "${assets[@]}" dist/natron_testing-commit.txt
